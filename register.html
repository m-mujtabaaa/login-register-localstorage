<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .md{
    width: 100%;
    height: 100%;
    justify-items: center;
    
}
.lg{
    padding:25px 0px 30px 150px;
    font-size: 40px;
    
}
form{
    font-family: arial;
    padding: 10px 35px 10px 10px;
    box-shadow: 0.5px 0.5px 6px;
    margin: 200px auto 200px auto;
    width: 400px;
    border-radius: 8px;
    color: rgb(12, 33, 61);
    background-color: rgb(255, 255, 255);
}
.label{
    font-size: 20px;
    margin: 0px 5px 15px 25px;
}
.rm{
    color: rgba(255, 255, 255, 0.747);
    margin: 0px 5px 20px 25px;
}
.input{
    margin: 10px 0px 20px 25px;
    padding: 12px 200px 12px 5px;
    border-radius: 4px;
    border: 1px solid grey;
}
button{
    padding: 13px 162px 13px 163px;
    border-radius: 5px;
    font-size: 15px;
    background-color:rgb(7, 81, 151);
    border: 0px;
    color: white;
    margin: 0px 5px 25px 25px;
}
button:hover{
    background-color: rgb(48, 4, 59);
    color: rgb(255, 255, 255);
    transition:0.3s;
}
</style>
<body>
    <div class="md">
        <form>
            <h2 class="lg">Register</h2>
                <label class="label">User Name</label><br>
                <input type="text" required  placeholder="User Name" class="input" id="name"><br>
                <label class="label">Email</label><br>
                <input type="email"  placeholder="Email(Optional)" class="input" id="email"><br>
                <label class="label">Password</label><br>
                <input type="password"  placeholder="Password" class="input" id="password"><br>
                <input type="checkbox" class="rm"><label for="">Remember me</label>
                <button onclick="saveinfo()" type="button"><b>Submit</b></button>
            </div>
            </form>
</div>
<script src="script.js"></script>
</body>
</html>
